[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[project]
name = "rendercv-web-backend"
version = "0.1.0"
description = "FastAPI backend for the RenderCV Web Editor; wraps the rendercv core as a service."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.121.2",
  "uvicorn>=0.38.0",
  "rendercv[full]",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "httpx>=0.28.1",
]

# Why Postgres is an extra and not a plain dependency: development and the
# whole test suite run on SQLite, which needs no driver at all, so a
# deployment opts in with `uv sync --extra postgres` rather than every
# contributor building a database driver they never use.
[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2.3"]

[dependency-groups]
dev = [
  "pytest>=9.0.2",
]

[tool.uv.sources]
rendercv = { path = "../../", editable = true }

[tool.uv.build-backend]
module-name = "rendercv_web"

[tool.pytest.ini_options]
testpaths = ["tests"]
